name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so upstream releases that break fresh installs (like mcp 2.0
    # removing mcp.server.fastmcp) are caught even when nothing here changed.
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
      - name: Stub the Apple Books databases
        # py-apple-books opens these at import time; empty files are valid SQLite databases.
        run: |
          d="$HOME/Library/Containers/com.apple.iBooksX/Data/Documents"
          mkdir -p "$d/BKLibrary" "$d/AEAnnotation"
          touch "$d/BKLibrary/BKLibrary-stub.sqlite" "$d/AEAnnotation/AEAnnotation-stub.sqlite"
      # --locked fails if uv.lock is stale, rather than testing a different
      # resolution than the one the release ships. The dev install (uv
      # sync) provides the console script.
      - run: uv run --locked apple-books-mcp --version
      - run: uv run --locked pytest -q

  floor:
    # The lowest versions pyproject.toml allows for its direct
    # dependencies (mcp, py-apple-books, click) on the lowest Python.
    # Dependabot moves uv.lock on, so without this nothing would test
    # that the declared minimums still work.
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
      - name: Stub the Apple Books databases
        run: |
          d="$HOME/Library/Containers/com.apple.iBooksX/Data/Documents"
          mkdir -p "$d/BKLibrary" "$d/AEAnnotation"
          touch "$d/BKLibrary/BKLibrary-stub.sqlite" "$d/AEAnnotation/AEAnnotation-stub.sqlite"
      - run: uv venv
      - run: uv pip install --resolution lowest-direct -e .
      # Separately, or lowest-direct would pick an ancient pytest.
      - run: uv pip install pytest
      - run: uv pip list
      - run: .venv/bin/python -m pytest -q

  smoke:
    # Installs the built wheel the way users do (uvx, fresh resolution, no
    # lockfile) and checks the server answers initialize + tools/list.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
      - name: Stub the Apple Books databases
        run: |
          d="$HOME/Library/Containers/com.apple.iBooksX/Data/Documents"
          mkdir -p "$d/BKLibrary" "$d/AEAnnotation"
          touch "$d/BKLibrary/BKLibrary-stub.sqlite" "$d/AEAnnotation/AEAnnotation-stub.sqlite"
      # Like the release build: sdist first, then the wheel from the sdist.
      - run: uv build
      - run: uvx --refresh --from dist/*.whl apple-books-mcp --version
      - run: python3 scripts/smoke_test.py uvx --refresh --from dist/*.whl apple-books-mcp

  mcpb:
    # Builds the Claude Desktop extension like the release does (the
    # official packer validates the manifest) and installs it the way
    # Claude Desktop does: uv sync in the unpacked bundle, then the
    # manifest's command.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
      # --no-audit: see the release workflow's packer step.
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix mcpb
      - run: uv run --locked python scripts/build_mcpb.py --out mcpb-dist
      - run: python3 scripts/build_mcpb.py --smoke mcpb-dist/*.mcpb
      # The release validates the same file before publishing anything;
      # this catches a server.json the registry rejects before it merges.
      - name: Install mcp-publisher
        run: |
          curl -sSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate mcpb-dist/server.json

  perf:
    # Time, output-size, SQL and memory budgets on a 2,000-book,
    # 50,000-annotation synthetic library (tests/test_perf_budgets.py),
    # with the locked dependencies and with a fresh resolution, so a
    # slower py-apple-books or mcp release shows up in the weekly run.
    runs-on: ubuntu-latest
    env:
      APPLE_BOOKS_MCP_PERF: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
      - name: Locked dependencies
        run: uv run --locked --python 3.13 pytest -q tests/test_perf_budgets.py
      - name: Fresh resolution
        run: uv run --isolated --no-project --python 3.13 --with . --with pytest pytest -q tests/test_perf_budgets.py
