[project]
name = "apple-books-mcp"
version = "0.8.4"
description = "Model Context Protocol (MCP) server for Apple Books"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache 2.0" }
authors = [ { name="Vignesh Iyer", email="vgnshiyer@gmail.com" } ]
keywords = [ "apple-books", "mcp", "model-context-protocol", "apple-books-mcp", "llm", "productivity" ]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.1.8",
    # The server is written against the mcp 1.x FastMCP API
    # (mcp.server.fastmcp), which mcp 2.x removed. 1.10 is the first
    # release whose tools take a title (and protocol 2025-06-18).
    "mcp>=1.10.0,<2",
    "py-apple-books>=1.10,<2",
    # Imported directly for the tool parameter types; mcp 1.x requires
    # the same range.
    "pydantic>=2.7.2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Just the package and its tests, not the repo's CI, Docker and docs files.
include = ["/apple_books_mcp", "/tests", "/README.md", "/LICENSE"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.5",
]

[project.scripts]
apple-books-mcp = "apple_books_mcp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
